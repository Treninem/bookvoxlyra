name: Sync live canonical cover

on:
  push:
    paths:
      - '.cover-sync-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and validate live canonical cover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          url='https://voxlyra.bothost.tech/media/cover/2229'
          dest=Path('books/schastye-vo-mne-final/cover.jpg')
          req=urllib.request.Request(url,headers={'User-Agent':'VoxLyra-Canonical-Cover-Sync/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=r.read()
              ctype=str(r.headers.get('Content-Type') or '').lower()
          if len(data)<100_000 or data[:2]!=b'\xff\xd8' or 'image/jpeg' not in ctype:
              raise SystemExit('Live canonical cover validation failed')
          old=dest.read_bytes() if dest.is_file() else b''
          if old!=data:
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              Path('.cover_changed').write_text('1')
          else:
              Path('.cover_changed').write_text('0')
          print('cover_size',len(data),'sha256',hashlib.sha256(data).hexdigest())
          PY
      - name: Commit real JPEG cover
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat .cover_changed)" != "1" ]; then rm -f .cover_changed; exit 0; fi
          rm -f .cover_changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/schastye-vo-mne-final/cover.jpg
          git commit -m 'Replace Schastye cover placeholder with live canonical JPEG'
          git push
